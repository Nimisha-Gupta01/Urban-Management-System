version: '3.9'

services:
  app:
    build: .
    container_name: utms_app
    ports:
      - "5000:5000"
    volumes:
      # Persist the SQLite DB across container restarts
      - db_data:/app/data
    environment:
      - FLASK_APP=app/app.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
    restart: unless-stopped

volumes:
  db_data:
