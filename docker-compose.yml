services:

  postgres:
    image: postgres:16-alpine
    container_name: utms_postgres
    environment:
      POSTGRES_DB:       traffic_db
      POSTGRES_USER:     traffic_user
      POSTGRES_PASSWORD: traffic_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_user -d traffic_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: utms_api
    ports:
      - "8000:8000"
    environment:
      PGHOST:     postgres
      PGPORT:     "5432"
      PGDATABASE: traffic_db
      PGUSER:     traffic_user
      PGPASSWORD: traffic_pass
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  streamlit:
    build: .
    container_name: utms_streamlit
    ports:
      - "8501:8501"
    environment:
      API_BASE: http://api:8000
    depends_on:
      - api
    command: streamlit run streamlit_app/Home.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped

volumes:
  pg_data:
