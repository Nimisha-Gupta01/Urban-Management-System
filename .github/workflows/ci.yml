name: CI — Urban Traffic Management System

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint + Schema + API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate SQL schema syntax
        run: |
          python3 -c "
          import sqlite3, os
          db = sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys = ON')
          db.execute('PRAGMA journal_mode = WAL')
          for f in ['sql/schema.sql']:
              with open(f) as fh:
                  db.executescript(fh.read())
          print('Schema SQL: OK')
          "

      - name: Initialise database
        run: python init_db.py --reset

      - name: Run API tests
        run: pytest tests/ -v

      - name: Verify DB record counts
        run: |
          python3 -c "
          import sqlite3
          db = sqlite3.connect('data/traffic.db')
          checks = [
              ('Zone',               5),
              ('Road',              20),
              ('Junction',          15),
              ('Traffic_Observation', 80),
              ('Incident',          30),
              ('Driver',            20),
              ('Vehicle',           25),
          ]
          all_ok = True
          for table, expected in checks:
              count = db.execute(f'SELECT COUNT(*) FROM {table}').fetchone()[0]
              ok = count >= expected
              status = 'OK' if ok else 'FAIL'
              print(f'  {status}  {table}: {count} rows (expected >= {expected})')
              if not ok: all_ok = False
          if not all_ok: raise SystemExit('Record count check failed')
          print('All record count checks passed.')
          "

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t utms:ci .

      - name: Smoke-test container
        run: |
          docker run -d --name utms-test -p 5000:5000 utms:ci
          sleep 5
          curl -sf http://localhost:5000/api/health || (docker logs utms-test && exit 1)
          docker stop utms-test
