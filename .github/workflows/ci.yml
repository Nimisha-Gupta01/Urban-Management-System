name: CI — Urban Traffic Management System

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Schema + API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       traffic_db
          POSTGRES_USER:     traffic_user
          POSTGRES_PASSWORD: traffic_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST:     localhost
      PGPORT:     "5432"
      PGDATABASE: traffic_db
      PGUSER:     traffic_user
      PGPASSWORD: traffic_pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialise database
        run: python init_db.py --reset

      - name: Verify DB record counts
        run: |
          python3 -c "
          import psycopg2, os
          conn = psycopg2.connect(
              host=os.getenv('PGHOST','localhost'),
              dbname=os.getenv('PGDATABASE','traffic_db'),
              user=os.getenv('PGUSER','traffic_user'),
              password=os.getenv('PGPASSWORD','traffic_pass'),
          )
          checks = [
              ('Zone',               5),
              ('Road',              20),
              ('Junction',          15),
              ('Traffic_Observation', 80),
              ('Incident',          30),
              ('Driver',            20),
              ('Vehicle',           25),
          ]
          all_ok = True
          cur = conn.cursor()
          for table, expected in checks:
              cur.execute(f'SELECT COUNT(*) FROM {table}')
              count = cur.fetchone()[0]
              ok = count >= expected
              status = 'OK  ' if ok else 'FAIL'
              print(f'  {status} {table}: {count} rows (expected >= {expected})')
              if not ok: all_ok = False
          conn.close()
          if not all_ok: raise SystemExit('Record count check failed')
          print('All record count checks passed.')
          "

      - name: Run API tests
        run: pytest tests/ -v

  docker:
    name: Docker Build + Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t utms:ci .

      - name: Start stack and smoke test
        run: |
          docker compose up -d
          sleep 20
          curl -sf http://localhost:8000/api/health || (docker compose logs && exit 1)
          docker compose down
